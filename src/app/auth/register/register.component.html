<div class="login-container" fxLayout="row" fxLayoutAlign="stretch">
    <mat-card>
        <mat-card-title>Create Account</mat-card-title>

        <mat-card-content>
            <form [formGroup]="signupForm" (ngSubmit)="onSignup()">
                <mat-card-content>
                    <mat-form-field appearance="fill">
                        <mat-label>Full Name</mat-label>
                        <input matInput formControlName="firstname" required />
                        <mat-error *ngIf="signupForm.get('firstname')?.hasError('required')">First Name is
                            required</mat-error>
                    </mat-form-field>

                    <!-- <mat-form-field appearance="fill">
                        <mat-label>Last Name</mat-label>
                        <input matInput formControlName="lastname" required />
                        <mat-error *ngIf="signupForm.get('lastname')?.hasError('required')">Last Name is
                            required</mat-error>
                    </mat-form-field> -->

                    <mat-form-field appearance="fill">
                        <mat-label>Email</mat-label>
                        <input matInput formControlName="email" type="email" required />
                        <mat-error *ngIf="signupForm.get('email')?.hasError('required')">Email is required</mat-error>
                        <mat-error *ngIf="signupForm.get('email')?.hasError('email')">Invalid email format</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill">
                        <mat-label>Password</mat-label>
                        <input matInput formControlName="password" type="password" required />
                        <mat-error *ngIf="signupForm.get('password')?.hasError('required')">Password is
                            required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill">
                        <mat-label>Confirm Password</mat-label>
                        <input matInput formControlName="passwordConfirm" type="password" required />
                        <mat-error *ngIf="signupForm.get('passwordConfirm')?.hasError('required')">Confirm password is
                            required</mat-error>
                    </mat-form-field>
                </mat-card-content>

                <mat-card-actions>
                    <button mat-raised-button color="primary" type="submit" [disabled]="signupForm.invalid"
                        style="width: 60%;">Sign
                        Up</button>
                </mat-card-actions>
                <mat-card-actions>
                    <p style="color: green;   padding-top: 1em;">Already have an account? &nbsp;</p><button mat-button (click)="gotoLogin()"
                        style="width: 40%;">Login</button>
                </mat-card-actions>
            </form>
        </mat-card-content>

    </mat-card>
</div>
