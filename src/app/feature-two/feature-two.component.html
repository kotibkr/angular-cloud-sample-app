<div class="content">

  <div class="container">
    <mat-card style="padding: 1em;">
      <div class="referral-container"></div>
      <h4>Share Your Referral Link</h4>
      <mat-form-field appearance="fill">
        <mat-label>Enter Your Referral Code</mat-label>
        <input matInput [(ngModel)]="referralCode" placeholder="Referral Code" />
      </mat-form-field>
      <button class="btn-generate" mat-raised-button color="primary" (click)="generateReferralLink()">Generate
        Link</button>

      <div *ngIf="referralLink" class="link-container">
        <mat-form-field appearance="fill" style="width: 60%; padding: 1em;">
          <mat-label>Invite your friends with yur unique Referral Link</mat-label>
          <input matInput [value]="referralLink" readonly />
        </mat-form-field>
        <button mat-raised-button (click)="copyLink(referralLink)">Copy Link</button>
      </div>
    </mat-card>
  </div>


  <div class="row">
    <div class="col-md-4">
      <h4>My Referals</h4>
    </div>
    <!-- <div class="col-md-8">
      <mat-form-field>
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
      </mat-form-field>
    </div> -->
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Checkbox Column -->
    <!-- <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container> -->

    <!-- Position Column -->
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Referrals Links </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Weight Column -->
    <ng-container matColumnDef="weight">
      <th mat-header-cell *matHeaderCellDef> Henny coins </th>
      <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
    </ng-container>

    <!-- Symbol Column -->
    <!-- <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef> Symbol </th>
      <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
    </ng-container> -->

    <!-- Star Column -->
    <ng-container matColumnDef="star" stickyEnd>
      <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
      <td mat-cell *matCellDef="let element">
        <mat-icon>more_vert</mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
    </tr>
  </table>


</div>
